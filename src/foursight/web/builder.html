<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>4sight -- Graph Builder</title>
  <link rel="stylesheet" href="/static/builder.css?v=4">
</head>
<body>
  <div id="toolbar">
    <button id="btn-task" onclick="startCreate('task')">+ Task</button>
    <button id="btn-leaf" onclick="startCreate('leaf')">+ Data Source</button>
    <span class="sep"></span>
    <button class="primary" id="btn-assess" onclick="runAssessment()">Run Assessment</button>
    <span id="assess-note" style="display:none;color:#b45309;font-size:12px;margin-left:8px;">values changed -- run assessment</span>
  </div>
  <div id="assess-status">
    <div class="spinner"></div>
    <span>Running assessment -- the LLM is evaluating the graph...</span>
  </div>
  <div id="main-area">
    <svg id="svg-canvas"></svg>
    <div id="panel-resizer" title="Drag to resize"></div>
    <div id="node-panel">
      <h3 id="panel-title">New Node</h3>
      <label>Name</label>
      <input id="panel-name" placeholder="Task name">
      <label>Kind</label>
      <select id="panel-kind" onchange="onKindChange()">
        <option value="task">Task</option>
        <option value="leaf">Data Source (leaf)</option>
      </select>
      <div id="panel-leaf-fields" style="display:none;">
        <label>Adapter ID</label>
        <input id="panel-adapter" placeholder="csv">
        <label>Query</label>
        <textarea id="panel-query" placeholder="SQL or file path"></textarea>
        <button onclick="testQuery()" style="width:auto;padding:3px 10px;font-size:11px;background:#0f766e;color:#fff;border:none;border-radius:4px;cursor:pointer;">Run query (test)</button>
        <div id="query-test-result" style="font-size:11px;margin-top:4px;"></div>
        <label>Current readings (editable -- changing a value injects a problem)</label>
        <div id="panel-readings" style="font-size:12px;color:#1f2937;"></div>
      </div>
      <label>Description</label>
      <textarea id="panel-desc" placeholder="Describe this task"></textarea>

      <!-- Field Rules (leaf nodes only) -->
      <div id="panel-field-rules-section" style="display:none;">
        <label style="display:flex;justify-content:space-between;align-items:center;">
          Field Rules
          <button id="btn-add-field-rule" onclick="addFieldRule()" style="width:auto;padding:2px 8px;font-size:11px;background:#1d4ed8;color:#fff;border:none;border-radius:4px;cursor:pointer;">+ Add</button>
        </label>
        <div id="panel-field-rules"></div>
      </div>

      <!-- Inbound Signals (task nodes, read-only) -->
      <div id="panel-signals" style="display:none;">
        <label>Inbound Signals</label>
        <div id="panel-inbound-signals"></div>
        <label>Outbound Signal</label>
        <div id="panel-outbound-signal" style="font-size:12px;color:#6b7280;"></div>
      </div>

      <!-- Chroma-grounded LLM context summary (unstructured sources + tasks only) -->
      <div id="panel-context-section" style="display:none;">
        <label>Context (vector search + LLM)</label>
        <div id="panel-context" style="font-size:12px;color:#6b7280;font-style:italic;"></div>
      </div>

      <div style="display:flex;gap:8px;margin-top:8px;">
        <button onclick="saveNodePanel()" style="flex:1;background:#1a3a5c;color:#e6e6e6;border:1px solid #2a5a8c;border-radius:6px;padding:8px;cursor:pointer;">Save</button>
        <button onclick="closePanel()" style="flex:1;background:#1a1d24;color:#e6e6e6;border:1px solid #2a2e36;border-radius:6px;padding:8px;cursor:pointer;">Cancel</button>
      </div>
      <button id="btn-delete" onclick="deleteSelectedNode()" style="display:none;width:100%;margin-top:4px;background:#4a1018;color:#ff6b6b;border:1px solid #6b1a1a;border-radius:6px;padding:8px;cursor:pointer;">Delete node</button>
      <div id="panel-relations" style="margin-top:12px;display:none;">
        <label>Depends on me</label>
        <div class="rel-list" id="panel-dependents"></div>
        <label>I depend on</label>
        <div class="rel-list" id="panel-dependencies"></div>
      </div>
    </div>
  </div>
  <script src="/static/builder.js?v=4"></script>
  <script>init();</script>
</body>
</html>
